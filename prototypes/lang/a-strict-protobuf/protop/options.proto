edition = "2023";

package protop;

import "google/protobuf/descriptor.proto";

// The dialect revision. See issue #27 — this enum's value list IS protopc's
// supported-revision table, which is why it ships inside the compiler.
enum Revision {
  REVISION_UNKNOWN = 0;
  REVISION_1 = 1;
}

// The shape axis. Protobuf has exactly one declaration form — `message` — so a
// strict-profile protop has to spell the distinction as an option.
enum Shape {
  SHAPE_UNKNOWN = 0;
  SHAPE_RECORD = 1;  // payload, reference type, no identity
  SHAPE_TABLE  = 2;  // payload with identity: a cache entity
  SHAPE_STRUCT = 3;  // value payload, embedded, C# struct
}

// The three [DataCacheIndexType] values the corpus actually uses.
enum IndexKind {
  INDEX_KIND_NONE  = 0;
  INDEX_KIND_ONE   = 1;  // [DataCacheIndex]
  INDEX_KIND_RANGE = 2;  // [DataCacheIndex(DataCacheIndexType.Range)]
  INDEX_KIND_MANY  = 3;  // [DataCacheIndex(DataCacheIndexType.Many)]
}

// ---------------------------------------------------------------------------
// Computed members. The corpus has seven of them and they fall into three
// classes, not one — see prototypes/lang/README.md. None of the three needs an
// expression; all three are declarations. That is the single most useful thing
// writing this file taught us, because issue #6 had "computed-member escape
// hatch" down as the hardest requirement on the board.
// ---------------------------------------------------------------------------

// Class 1 — composite identity. Five corpus types have one. It is a get-only
// ValueTuple over two fields that each keep their own tag, and it OCCUPIES A
// WIRE SLOT of its own (always [Key(0)], i.e. tag 1), so it duplicates on the
// wire what the component fields already carry.
message CompositeKey {
  string name = 1;            // emitted member name
  int32  tag  = 2;            // the slot it occupies
  repeated string field = 3;  // component fields, in tuple order
}

// Class 2 — derived index. One corpus instance:
//   [DataCacheIndex(nameof(FixtureIdIndex), nameof(FixtureId), Many)]  (class-level)
//   [DataCacheIndex] [IgnoreMember] public int FixtureIdIndex => FixtureId ?? 0;
// [IgnoreMember], so NO wire slot. `?? 0` is not an expression: it is the
// declared substitute for absent, and `absent_as` is the whole of it.
message DerivedIndex {
  string name = 1;
  string field = 2;
  int64  absent_as = 3;
  IndexKind kind = 4;
}

// Class 3 — alias. One corpus instance, on BOBetTypeCacheItem:
//   [IgnoreMember] [JsonIgnore] public long BetTypeId { get => Id; set => Id = value; }
// get AND set, no wire slot. It exists so BOBetTypeCacheItem's API matches its
// projection SlimBetType, which names the same tag-3 field `BetTypeId`.
message Alias {
  string name = 1;
  string field = 2;
}

extend google.protobuf.FileOptions {
  Revision revision = 50001;
}

extend google.protobuf.MessageOptions {
  Shape shape = 50010;

  // [DataCacheTopic("...")]. Present on every SHAPE_TABLE in the corpus.
  string cache_topic = 50020;

  CompositeKey composite_key = 50021;
  repeated DerivedIndex derived_index = 50022;
  repeated Alias alias = 50023;

  // "This message is a field-subset of that one, at that one's tags."
  //
  // A STRING. protoc will not check that the message exists, that it is a
  // table, that this message's tags are a subset of its tags, or that the
  // types at those tags agree. Everything that makes a view safe is outside
  // what the strict profile can say. See prototypes/lang/README.md.
  string view_of = 50024;
}

extend google.protobuf.FieldOptions {
  // Marks the identity field of a SHAPE_TABLE, when identity IS a stored
  // field. Emits [DataCacheKey]. Mutually exclusive with composite_key.
  bool table_key = 50011;
  // Money: emit ScaledDecimalFormatter<S> rather than MessagePack's
  // decimal-as-string. See issue #13.
  int32 decimal_scale = 50012;

  IndexKind index = 50013;

  // [DataCacheFromTimestamp]. One corpus instance: SlimBetType.Timestamp.
  bool from_timestamp = 50014;

  // Which field of view_of this field projects. Another unchecked string.
  string view_field = 50025;
}
