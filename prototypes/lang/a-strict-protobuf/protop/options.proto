edition = "2023";

package protop;

import "google/protobuf/descriptor.proto";

option csharp_namespace = "Protop.Options";

// ---------------------------------------------------------------------------
// The option vocabulary spelling A needs.
//
// RETIRED, and the reason, because a language prototype that quietly drops
// things is not a prototype:
//   cache_topic    the topic is not a language concept. It is one more C#
//                  attribute, and attributes now have a passthrough spelling.
//   IndexKind      an index is an application decision, not a schema fact.
//   index          "  "
//   DerivedIndex   a member that exists ONLY to be indexed. Dies with index.
//   from_timestamp [DataCacheFromTimestamp] is an attribute like any other.
// Their extension numbers are reserved below, never reused.
// ---------------------------------------------------------------------------

enum Revision {
  REVISION_UNKNOWN = 0;
  REVISION_1 = 1;
}

enum Shape {
  SHAPE_UNKNOWN = 0;
  SHAPE_STRUCT  = 1;  // value payload, embedded, C# struct
  SHAPE_RECORD  = 2;  // payload, no identity, C# sealed class
  SHAPE_TABLE   = 3;  // payload WITH identity, C# sealed class + cache attrs
}

// Identity that is a tuple over stored fields rather than a stored field.
// Occupies a tag of its own: in the corpus the tuple is [Key(0)] and duplicates
// on the wire what its component tags already carry.
message CompositeKey {
  string name = 1;            // emitted member name
  int32  tag  = 2;            // the slot it occupies
  repeated string field = 3;  // component fields, in tuple order
}

enum Cardinality {
  CARDINALITY_UNKNOWN = 0;
  CARDINALITY_ONE     = 1;  // local FK field -> one row of target
  CARDINALITY_MANY    = 2;  // far side holds the FK
  CARDINALITY_MANY_TO_MANY = 3;  // via a join table. NO CORPUS INSTANCE.
}

// Many-to-many, which has NO CORPUS INSTANCE — and after the measurement above,
// no plausible one either: a join needs two keyed ends, and 25 of the corpus's
// 36 FK-shaped members have no keyed end to join to. It is the one relation
// with no single owning field, so it is the one that must stay message-level;
// that placement is a consequence of the unary/binary rule, not an exception.
// It remains the fog it was, now with a measurement against it.
message ManyToMany {
  string member  = 1;
  string target  = 2;
  string through = 3;
}

// [IgnoreMember] get/set passthrough to another field. No wire slot.
message Alias {
  string name  = 1;
  string field = 2;
}

extend google.protobuf.FileOptions {
  Revision revision = 50001;
}

extend google.protobuf.MessageOptions {
  Shape shape = 50010;
  CompositeKey composite_key = 50021;
  repeated ManyToMany many_to_many = 50022;
  repeated Alias alias = 50023;
  string view_of = 50024;

  // Verbatim C# attribute text, emitted onto the generated type without
  // protopc understanding it. This is the `passthrough` of CONTEXT.md, and it
  // is where cache_topic and DataCacheIndex went.
  //
  // It has to be called `type_attribute` rather than `attribute` because
  // extension names live in a FLAT package namespace: one name cannot extend
  // both MessageOptions and FieldOptions. Measured —
  //   protop/options.proto:100:19: "attribute" is already defined in "protop".
  // So spelling A needs two names for one concept, and every author has to know
  // which is which. Spelling B has one: `[Attribute]`, wherever it goes.
  repeated string type_attribute = 50030;

  // RETIRED, never reused: 50020 was cache_topic.
  // (`reserved` is a message-level statement; protoc rejects it inside
  //  `extend`, so retired extension numbers can only be a comment. One more
  //  thing the strict profile cannot enforce — measured, see the README.)
}

extend google.protobuf.FieldOptions {
  bool table_key = 50011;

  // RELATIONS, on the field rather than on the message.
  //
  // Better than the message-level form it replaces, for a reason worth stating
  // precisely: that form carried `field: "sport_type_id"`, a STRING naming a
  // member of the same message, and protoc checked no part of it. On the field
  // there is no `field:` to get wrong. Relation-borne member names in
  // prague.proto went 11 -> 6, and the split is the general rule:
  //
  //   a UNARY fact (this member holds T's identity) sits on the member and
  //   costs no name at all;
  //   a BINARY fact (these two members are halves of one thing) must name one
  //   member from the other, wherever it is written.
  //
  // `references` names a TABLE, not a field: it resolves to that table's
  // declared key, so arity and type are checkable and a composite-key target
  // needs no new syntax. Still a bare string to protoc.
  //
  // HOW LITTLE THIS IS USED, measured. Of the corpus's 36 foreign-key-shaped
  // members, 25 name no cached type at all and 4 more are opaque ids; only
  // EventId and BetTypeId resolve. And EventId resolves to SIX types at once —
  // twins and projections sharing an identity and a key space — so even the
  // grounded case does not pick a target out. protop has no answer for that.
  string references = 50040;

  // This field is a denormalized copy of the referent that `snapshot_of` names
  // the id of. It resolves to a MEMBER of the same message and stops there: it
  // does NOT follow that member's `references`, because in every corpus
  // instance there is nothing to follow. All 15 snapshot pairs sit on ids that
  // name no type — the copy exists precisely BECAUSE the referent does not.
  //
  // The check it buys needs no target type to exist, which is why it survives
  // that finding: the two halves must agree about presence. Three of the 15
  // pairs do not, including SlimSportGame's `long? HomeTeamId` beside a
  // non-nullable `StaticDataRef HomeTeam = null!`.
  string snapshot_of = 50041;
  int32 decimal_scale = 50012;
  string view_field = 50025;
  repeated string field_attribute = 50031;

  // RETIRED, never reused: 50013 was index, 50014 was from_timestamp.
}
